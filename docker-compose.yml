version: '3.8'

services:
  web:
    build: .
    container_name: recurring_web
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=recurring_mgt
      - DB_USER=recurring_user
      - DB_PASS=secretpassword
      - PNP_MOCK_MODE=true
      - APP_URL=http://localhost:8080
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: recurring_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: recurring_mgt
      MYSQL_USER: recurring_user
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
