version: '3.8'

services:
  web:
    image: recurringmgt-web:latest
    container_name: craftbrew_web
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=craftbrew
      - DB_USER=brewuser
      - DB_PASS=brewpassword
      - APP_URL=http://localhost:8080
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: craftbrew_db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: craftbrew
      MARIADB_USER: brewuser
      MARIADB_PASSWORD: brewpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
